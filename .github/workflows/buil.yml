name: CI/CD Matching Platform

on:
  push:
    branches:
      - main

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:

# ================= FRONTEND ANGULAR =================
  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.12

    - name: Install dependencies
      run: |
        cd matching_front
        npm install

    - name: Build Angular
      run: |
        cd  ./matching_front
        npm run build

    - name: Build Image Frontend
      uses: docker/build-push-action@v2
      with:
        context: ./matching_front         # dossier contenant Dockerfile
        dockerfile: ./matching_front/Dockerfile               # chemin relatif du Dockerfile
        push: false                          # push automatique
        tags:  ${{ env.DOCKER_USER }}/matching-frontend:latest

    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USER }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Push Frontend
      uses: docker/build-push-action@v2
      with:
        context:  ./matching_front         # dossier contenant Dockerfile
        dockerfile: ./matching_front/Dockerfile                 # chemin relatif du Dockerfile
        push: true                           # push automatique
        tags:  ${{ env.DOCKER_USER }}/matching-frontend:latest



# ================= BACKEND SPRING BOOT =================
  backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Grant execute permission for mvnw
      run: chmod +x matching_back/mvnw

    - name: Run tests
      run: |
        cd matching_back
        ./mvnw test

    - name: Package Spring Boot
      run: |
        cd matching_back
        ./mvnw clean package -DskipTests

    - name: Build Image Backend
      uses: docker/build-push-action@v2
      with:
        context: ./matching_back          # dossier contenant Dockerfile
        dockerfile: ./matching_back/Dockerfile               # chemin relatif du Dockerfile
        push: false                          # push automatique
        tags:  ${{ env.DOCKER_USER }}/matching-backend:latest

    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USER }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Push Backend
      uses: docker/build-push-action@v2
      with:
        context: ./matching_back          # dossier contenant Dockerfile
        dockerfile: ./matching_back/Dockerfile               # chemin relatif du Dockerfile
        push: true                         # push automatique
        tags:  ${{ env.DOCKER_USER }}/matching-backend:latest



# ================= CV PARSER =================
  cv-parser:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd parser_cv
        pip install -r requirements.txt

    - name: Run tests
      run: |
        cd parser_cv
        pytest || true
    
    - name: Build Image Parser CV
      uses: docker/build-push-action@v2
      with:
        context: ./parser_cv         # dossier contenant Dockerfile
        dockerfile: ./parser_cv/Dockerfile               # chemin relatif du Dockerfile
        push: false                          # push automatique
        tags:  ${{ env.DOCKER_USER }}/parser_cv:latest

    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USER }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Build Image Parser CV
      uses: docker/build-push-action@v2
      with:
        context: ./parser_cv          # dossier contenant Dockerfile
        dockerfile: ./parser_cv/Dockerfile               # chemin relatif du Dockerfile
        push: true                         # push automatique
        tags:  ${{ env.DOCKER_USER }}/parser_cv:latest



# ================= OFFER PARSER =================
  offer-parser:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd parser_offer
        python -m pip install --upgrade pip  
        pip install -r requirements.txt

    - name: Run tests
      run: |
        cd parser_offer
        pytest || true

    - name: Build Image Parser Offer
      uses: docker/build-push-action@v2
      with:
        context: ./parser_offer         # dossier contenant Dockerfile
        dockerfile: ./parser_offer/Dockerfile               # chemin relatif du Dockerfile
        push: false                          # push automatique
        tags:  ${{ env.DOCKER_USER }}/cv_offer:latest


    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USER }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Push Parser Offer
      uses: docker/build-push-action@v2
      with:
        context: ./parser_offer        # dossier contenant Dockerfile
        dockerfile: ./parser_offer/Dockerfile                # chemin relatif du Dockerfile
        push: false                          # push automatique
        tags:  ${{ env.DOCKER_USER }}/cv_offer:latest

